<div class="top-bar">
  <h2>Products</h2>

  <div>
    <label>Filter by category: </label>
    <kendo-dropdownlist
      [data]="categoryOptions"
      [(value)]="selectedCategory"
      [style.width.px]="180"
    ></kendo-dropdownlist>
  </div>

  <button kendoButton themeColor="primary" routerLink="/products/add">Add Product</button>
</div>

<kendo-grid [data]="productService.products() | filterByCategory: selectedCategory">
  <kendo-grid-column field="name" title="Name"></kendo-grid-column>
  <kendo-grid-column field="category" title="Category"></kendo-grid-column>
  <kendo-grid-column field="price" title="Price">
    <ng-template kendoGridCellTemplate let-dataItem>
      <span [appHighlightExpensive]="dataItem.price">{{ dataItem.price | currency }}</span>
    </ng-template>
  </kendo-grid-column>
  <kendo-grid-column field="createdAt" title="Created">
    <ng-template kendoGridCellTemplate let-dataItem>
      {{ dataItem.createdAt | date: 'mediumDate' }}
    </ng-template>
  </kendo-grid-column>
  <kendo-grid-column title="Actions" [width]="240">
    <ng-template kendoGridCellTemplate let-dataItem>
      <button kendoButton (click)="selectedProduct.set(dataItem)">View</button>
      <button kendoButton [routerLink]="['/products', dataItem.id]">Edit</button>
      <button kendoButton themeColor="error" (click)="onDelete(dataItem)">Delete</button>
    </ng-template>
  </kendo-grid-column>
</kendo-grid>

@if (selectedProduct()) {
  <app-product-detail
    [product]="selectedProduct()!"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  ></app-product-detail>
}
