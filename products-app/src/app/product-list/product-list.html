<h2>Products</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Price</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (product of productService.products(); track product.id) {
      <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price | currency }}</td>
        <td>{{ product.createdAt | date: 'mediumDate' }}</td>
        <td><button (click)="selectedProduct.set(product)">View</button></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No products found.</td>
      </tr>
    }
  </tbody>
</table>

@if (selectedProduct()) {
  <app-product-detail [product]="selectedProduct()!" (delete)="onDelete($event)"></app-product-detail>
}
