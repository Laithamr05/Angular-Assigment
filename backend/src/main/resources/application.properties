spring.application.name=products-api

# Read local settings (database, JWT secret, admin user) from the .env file
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (the secret has no default, so the app will not start without it)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=120

# Admin user created on first start
app.demo.username=${DEMO_USERNAME:admin}
app.demo.password=${DEMO_PASSWORD}
